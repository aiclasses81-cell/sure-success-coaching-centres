<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 88" role="img" aria-label="Sure Success Coaching Centre">
  <defs>
    <linearGradient id="ssccBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="55%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0b1f4d"/>
    </linearGradient>
    <linearGradient id="ssccGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="ssccShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0b1f4d" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Shield -->
  <path d="M44 4 L78 14 V42 C78 60 64 76 44 84 C24 76 10 60 10 42 V14 Z"
        fill="url(#ssccBg)"/>
  <!-- Inner shield ring -->
  <path d="M44 9 L73 17.5 V42 C73 57.5 60.5 71.5 44 78.5 C27.5 71.5 15 57.5 15 42 V17.5 Z"
        fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>

  <!-- Open book base -->
  <g transform="translate(44 56)" filter="url(#ssccShadow)">
    <path d="M-19 0 C-13 -3 -6 -3 0 0 C6 -3 13 -3 19 0 L19 8 C13 5 6 5 0 8 C-6 5 -13 5 -19 8 Z"
          fill="#ffffff"/>
    <path d="M0 0 V8" stroke="#cbd5e1" stroke-width="0.8"/>
  </g>

  <!-- Star -->
  <g transform="translate(44 22)">
    <path d="M0 -10 L2.9 -3.1 L10.4 -2.4 L4.7 2.6 L6.4 10 L0 6 L-6.4 10 L-4.7 2.6 L-10.4 -2.4 L-2.9 -3.1 Z"
          fill="url(#ssccGold)"/>
  </g>

  <!-- SSCC monogram -->
  <text x="44" y="46" text-anchor="middle"
        font-family="'Poppins','Helvetica Neue',Arial,sans-serif"
        font-weight="800" font-size="15" letter-spacing="1.2"
        fill="#ffffff">SSCC</text>

  <!-- est. ribbon dot -->
  <circle cx="44" cy="51" r="0.9" fill="#fbbf24"/>
</svg>
