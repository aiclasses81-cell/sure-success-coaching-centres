  <circle cx="200" cy="200" r="280" fill="rgba(37,99,235,0.35)" filter="blur(40px)"/>
  <circle cx="1400" cy="1000" r="320" fill="rgba(251,191,36,0.18)" filter="blur(60px)"/>
