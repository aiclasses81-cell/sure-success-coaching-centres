<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="60"/></filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect width="1600" height="1200" fill="url(#grid)"/>
  <circle cx="320" cy="320" r="280" fill="#93c5fd" opacity="0.22" filter="url(#blur)"/>
  <circle cx="1300" cy="900" r="340" fill="rgba(255,255,255,0.08)" filter="url(#blur)"/>
  <g opacity="0.18">
    <circle cx="800" cy="600" r="220" fill="none" stroke="#fff" stroke-width="1.5"/>
    <circle cx="800" cy="600" r="170" fill="none" stroke="#fff" stroke-width="1"/>
  </g>
  <g transform="translate(800 540)" text-anchor="middle">
    <rect x="-260" y="-32" width="520" height="64" rx="32" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.25)"/>
    <text y="10" font-family="'Poppins',Arial,sans-serif" font-weight="700" font-size="24" fill="#93c5fd" letter-spacing="6">FOUNDATION BATCH</text>
  </g>
  <text x="800" y="660" text-anchor="middle" font-family="'Poppins',Arial,sans-serif" font-weight="800" font-size="74" fill="#ffffff" letter-spacing="1">SURE SUCCESS</text>
  <text x="800" y="710" text-anchor="middle" font-family="'Poppins',Arial,sans-serif" font-weight="600" font-size="26" fill="rgba(255,255,255,0.65)" letter-spacing="6">CLASS VI · VII · VIII</text>
  <text x="800" y="850" text-anchor="middle" font-family="'Poppins',Arial,sans-serif" font-weight="500" font-size="20" fill="rgba(255,255,255,0.40)">Replace with classroom-4.jpg</text>
